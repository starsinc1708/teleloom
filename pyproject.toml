[project]
name = "teleloom"
version = "0.5.0"
description = "Teleloom: Telegram tools, portable agent skills, MCP server and CLI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "mcp>=1.30,<2", "telethon>=1.45,<2", "aiogram[proxy]>=3.31,<4",
  "pydantic>=2.11,<3", "typer>=0.16,<1", "keyring>=25,<26",
  "platformdirs>=4,<5", "qrcode>=8,<9", "httpx>=0.28,<1",
  "uvicorn>=0.34,<1", "filelock>=3.18,<4", "python-socks[asyncio]>=2.7,<3",
  "Pillow>=11,<13", "tzdata>=2025.2",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.2,<1"]
pdf = ["pypdf>=5,<7"]
ocr = ["Pillow>=11,<13", "pytesseract>=0.3.13,<0.4"]
transcription = ["faster-whisper>=1.1,<2", "av>=11,<19"]

[project.urls]
Homepage = "https://github.com/starsinc1708/teleloom"
Documentation = "https://github.com/starsinc1708/teleloom/blob/main/docs/README.md"
Issues = "https://github.com/starsinc1708/teleloom/issues"
Changelog = "https://github.com/starsinc1708/teleloom/blob/main/CHANGELOG.md"

[project.scripts]
teleloom = "teleloom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleloom"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "teleloom/bundled_skills"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.16,<2", "types-qrcode", "build", "pyyaml>=6,<7", "pytest-xdist>=3.8,<4"]

[tool.pytest.ini_options]
addopts = "-n 2 --dist=loadgroup --durations=10 --strict-markers"
markers = [
  "release_e2e: real release preparation, artifact verification or owner replacement",
  "process_e2e: real CLI, stdio, installed package or deployment subprocesses",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
"src/teleloom/daemon.py" = ["SIM117"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
