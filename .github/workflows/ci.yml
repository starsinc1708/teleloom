name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_targets:
        description: Space-separated tests/ selectors; leave empty for one full suite
        type: string
        default: ''
      compatibility:
        description: Also run the offline suite on Python 3.13 and 3.14
        type: boolean
        default: false
      deployment:
        description: Build once and check wheel, desktop bundle and Docker
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/validate_skills.py
  checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELELOOM_CI_IMAGE: teleloom-ci:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan public history for secrets
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts='--all --full-history' --report-path "$RUNNER_TEMP/gitleaks.json"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/validate_skills.py
      - name: Offline tests (selected cases or one full suite)
        env:
          PYTEST_TARGETS: ${{ inputs.test_targets }}
        run: |
          targets=()
          if [[ -n "$PYTEST_TARGETS" ]]; then
            [[ "$PYTEST_TARGETS" != *$'\n'* ]]
            read -r -a targets <<< "$PYTEST_TARGETS"
            for target in "${targets[@]}"; do
              target_path=${target%%::*}
              [[ "$target_path" == tests/* && "$target_path" != *..* ]]
            done
          fi
          uv run pytest "${targets[@]}"
      - name: Build deployment artifacts once
        if: inputs.deployment
        env:
          TELELOOM_BUILD_TYPE: local
          TELELOOM_BUILD_ID: ci-${{ github.run_id }}
        run: uv build
      - name: Verify artifact identity without rebuilding
        if: inputs.deployment
        run: |
          uv run python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          from scripts.check_build_metadata import wheel_metadata
          wheel, = Path('dist').glob('*.whl')
          sdist, = Path('dist').glob('*.tar.gz')
          build = wheel_metadata(wheel)
          assert build['source_commit'] == os.environ['GITHUB_SHA']
          with tarfile.open(sdist) as archive:
              info, = (m for m in archive.getmembers() if m.name.endswith('/src/teleloom/_build_info.json'))
              assert json.load(archive.extractfile(info)) == build
          print(json.dumps({'build': build, 'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (wheel, sdist)}}))
          PY
      - name: Check the installed wheel
        if: inputs.deployment
        run: uv run python scripts/check_installed_package.py --wheel-dir dist
      - name: Package the same wheel for desktop
        if: inputs.deployment
        run: |
          wheels=(dist/teleloom-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          uv run python scripts/package_desktop.py --wheel "${wheels[0]}" --output dist/teleloom.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/desktop/manifest.json
      - name: Build and exercise Docker
        if: inputs.deployment
        run: |
          docker build --tag "$TELELOOM_CI_IMAGE" .
          uv run python scripts/smoke_container.py --image "$TELELOOM_CI_IMAGE"
      - name: Remove this run's Docker image
        if: always() && inputs.deployment
        run: |
          if docker image inspect "$TELELOOM_CI_IMAGE" >/dev/null 2>&1; then
            docker image rm "$TELELOOM_CI_IMAGE"
          fi
  compatibility:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.compatibility
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --frozen --all-extras
      - run: uv run pytest
