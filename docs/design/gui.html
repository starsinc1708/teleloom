<body>
  <a class="skip" href="#main">Перейти к содержимому</a>
  <div class="app">
    <button class="scrim" aria-label="Закрыть навигацию" data-action="menu-close"></button>
    <aside class="sidebar" aria-label="Главная навигация">
      <a class="brand" href="#overview" aria-label="Teleloom, обзор"><div class="wordmark">Teleloom</div><div class="brand-sub">TELEGRAM × MCP</div></a>
      <nav id="navigation"></nav>
      <div class="sidebar-foot"><div class="owner-mini"><span class="signal"></span><div><strong>Этот компьютер</strong><br>Демонстрационный workspace</div></div></div>
    </aside>
    <header class="topbar">
      <div class="top-left"><button class="icon-btn menu-toggle" aria-label="Открыть навигацию" aria-expanded="false" data-action="menu"></button><button class="workspace-pick" data-action="workspace" aria-label="Выбрать workspace"><span class="signal"></span><span class="workspace-label">Этот компьютер</span><span class="muted">⌄</span></button><span class="demo-tag">ДЕМО · МАКЕТ</span></div>
      <div class="top-right"><button class="search-trigger" data-action="search">Найти раздел <kbd>Ctrl K</kbd></button><label class="sr-only" for="state-picker">Демонстрационное состояние страницы</label><select class="state-control" id="state-picker"><option value="normal">Состояние: норма</option><option value="loading">Загрузка</option><option value="empty">Нет данных</option><option value="error">Ошибка</option></select><span class="avatar" aria-label="Владелец демо workspace">TL</span></div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script>
    // Design-only fixtures. No API calls, persistent storage, credentials or runtime access.
    const pages = [
      ['overview','Обзор','grid',20,'Работа'],['reading','Сообщения','chat',30,'Работа'],
      ['compose','Отправить','send',31,'Работа'],['jobs','Процессы','activity',22,'Работа'],
      ['profiles','Профили','users',21,'Управление'],['permissions','Доступ','shield',26,'Управление'],
      ['tools','Инструменты','sliders',23,'Управление'],['integrations','MCP и skills','plug',27,'Управление'],
      ['proxies','Прокси','network',28,'Управление'],['engines','AI и транскрипция','spark',29,'Управление'],
      ['remote','VPS и SSH','server',32,'Система'],['design','Стиль интерфейса','palette',33,'Система'],
      ['user-login','Подключить аккаунт','users',24,'Вход'],['bot-login','Подключить бота','bot',25,'Вход']
    ];
    const paths = {grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',chat:'M4 4h16v13H9l-5 4z M8 8h8 M8 12h5',send:'m3 4 18 8-18 8 4-8z M7 12h14',activity:'M2 12h5l3-8 4 16 3-8h5',users:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M20 21v-3a4 4 0 0 0-3-4 M17 3a4 4 0 0 1 0 7',shield:'m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5z m-4 10 3 3 5-6',sliders:'M4 3v7 M4 14v7 M12 3v2 M12 9v12 M20 3v11 M20 18v3 M1 10h6 M9 5h6 M17 14h6',plug:'M8 2v5 M16 2v5 M6 7h12v4a6 6 0 0 1-12 0z M12 17v5',network:'M9 2h6v6H9z M2 16h6v6H2z M16 16h6v6h-6z M12 8v4 M5 16v-4h14v4',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z',server:'M3 3h18v7H3z M3 14h18v7H3z M6 6h1 M6 17h1',palette:'M3 3h18v18H3z M3 10h18 M10 10v11',bot:'M5 7h14v13H5z M12 3v4 M9 3h6 M8 12h1 M15 12h1 M8 16h8',plus:'M12 4v16 M4 12h16',arrow:'M4 12h16 m-6-6 6 6-6 6',close:'m6 6 12 12 M6 18 18 6',menu:'M3 6h18 M3 12h18 M3 18h18',check:'m5 12 4 4 10-10'};
    const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name] || paths.grid}"/></svg>`;
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const button = (label, action, primary=false, extra='') => `<button class="btn ${primary?'primary':''}" data-action="${action}" ${extra}>${label}</button>`;
    const go = (label, page, primary=false) => `<a class="btn ${primary?'primary':''}" href="#${page}">${label}</a>`;
    const badge = (label, type='') => `<span class="status ${type}">${label}</span>`;
    const panel = (title, body, action='', foot='') => `<section class="panel"><div class="panel-head"><h2>${title}</h2>${action}</div>${body}${foot?`<div class="panel-foot">${foot}</div>`:''}</section>`;
    const person = (name, sub, initials='TL') => `<div class="person"><span class="avatar">${initials}</span><div><strong>${name}</strong><div class="muted">${sub}</div></div></div>`;
    const field = (label, id, value='', hint='', type='text') => `<label class="field"><span>${label}</span><input class="input" id="${id}" type="${type}" value="${escapeHTML(value)}" autocomplete="off">${hint?`<span class="hint">${hint}</span>`:''}</label>`;
    const toggle = (label, checked=false, extra='') => `<label class="switch"><input type="checkbox" aria-label="${label}" ${checked?'checked':''} ${extra}><span></span></label>`;
    const setting = (title, description, control) => `<div class="setting-row"><div><strong>${title}</strong><p>${description}</p></div>${control}</div>`;
    const profiles = [
      ['work-user','User · MTProto','WU','Подключён','', 'eu-primary','3 выбранных чата'],
      ['personal-demo','User · MTProto','PD','Не подключён','neutral','eu-backup','1 выбранный чат'],
      ['release-bot','Bot API','RB','Готов','', 'bot-route','Локальные updates']
    ];
    const jobs = [
      ['job-demo-018','Чтение: команда и релизы','work-user','Сбор данных','', '4 из 6 сообщений','14:26'],
      ['job-demo-017','Отправка: MCP community','work-user','Результат неизвестен','warn','Не повторять автоматически','14:18'],
      ['job-demo-016','Чтение: релизы','release-bot','Завершён','neutral','2 сообщения · evidence сохранены','13:42'],
      ['job-demo-015','Отправка: команда','work-user','Доставлен','', 'Receipt сохранён','12:04']
    ];
    const messages = [
      ['Алексей','Команда Teleloom','14:24','Предлагаю начать GUI с профилей и диагностики. Важно сразу видеть, какой аккаунт и какие разрешения используются.','demo-001'],
      ['Мария','Команда Teleloom','14:18','В макете отправки давайте оставим отдельный экран предпросмотра: профиль, точный получатель и весь текст сообщения.','demo-002'],
      ['Денис','MCP community','13:56','Нужна понятная настройка OpenCode и Hermes: сначала установка, затем проверка подключения и доступных инструментов.','demo-003'],
      ['Алексей','Команда Teleloom','13:45','Коллекцию прокси удобнее хранить отдельно, а профилям назначать именованные маршруты.','demo-004'],
      ['Release bot','Релизы','12:10','Демонстрационная сборка готова к проверке. Инструкции и пример конфигурации обновлены.','demo-005'],
      ['Мария','MCP community','11:40','Для VPS предлагаю приватный SSH tunnel и ту же защищённую панель, что локально.','demo-006']
    ];
    let current = 'overview', pageState='normal', modalReturn=null, toastTimer;
    let loginStep=1, userName='new-work-user', botConnected=false, receiptState=null, preview=null;
    const toolChanges = new Map();
    const toolState = new Map([['read',true],['send',true],['media',true],['admin',false]]);
    const $ = id => document.getElementById(id);
    function heading(title, description, actions='') {
      return `<div class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;
    }
    function navigation(){
      let group='';
      $('navigation').innerHTML=pages.filter(p=>p[4]!=='Вход').map(p=>{
        const label=p[4]!==group?`<div class="nav-label">${p[4]}</div>`:'';group=p[4];
        return label+`<a class="nav-item" href="#${p[0]}" ${current===p[0]?'aria-current="page"':''}>${icon(p[2])}<span>${p[1]}</span>${p[0]==='jobs'?'<span class="nav-count">2</span>':''}</a>`;
      }).join('');
      document.querySelector('.menu-toggle').innerHTML=icon('menu');
    }
    function overview(){
      const profileRows=profiles.map(p=>`<div class="row">${person(p[0],p[1],p[2])}${badge(p[3],p[4])}</div>`).join('');
      return heading('Обзор','Состояние workspace и задачи, которым нужно внимание.',go('Подключить профиль','user-login',true))+
        `<section class="owner-summary" aria-label="Состояние owner"><div class="owner-details"><div class="inline">${badge('Owner доступен')}<span class="mono muted">v0.5.0 · демо</span></div><h2>Этот компьютер</h2><div class="owner-facts"><span><strong>${profiles.length}</strong> профиля</span><span><strong>67</strong> инструментов</span><span><strong>6</strong> skills</span></div><div class="owner-facts"><span>Снимок состояния · 14:26</span><button class="tab" data-action="refresh">Обновить</button></div></div><div class="owner-art" aria-hidden="true"></div></section>`+
        `<div class="attention-line"><div><strong>Результат отправки неизвестен</strong><p>work-user → MCP community · 14:18</p></div>${go('Сверить результат','jobs')}</div>`+
        `<div class="grid two">${panel('Профили',profileRows,go('Открыть все','profiles'))}${panel('Процессы',`<div class="panel-body"><div class="timeline-row"><span class="signal"></span><div><div class="row-title">Сбор сообщений</div><div class="row-note">work-user · команда и релизы</div><div class="progress"><span style="width:67%"></span></div><div class="row-note">4 из 6 сообщений</div></div><span class="mono">14:26</span></div><div class="timeline-row"><span class="signal" style="background:var(--muted)"></span><div><div class="row-title">Снимок сохранён</div><div class="row-note">release-bot · 2 оригинала</div></div><span class="mono">13:42</span></div></div>`,go('Все процессы','jobs'))}</div>`+
        `<div class="client-line"><span>OpenCode 2 <span class="accent">· подключён</span></span><span>Hermes · требуется проверка</span><a href="#integrations" class="client-separator">MCP и skills ↗</a></div>`;
    }
    function profilePage(){
      return heading('Профили','Раздельные идентичности, возможности и разрешения.',go('Подключить бота','bot-login')+go('Добавить аккаунт','user-login',true))+
      `<div class="toolbar"><div class="filters"><button class="filter active" data-profile-filter="all">Все профили <span class="muted">3</span></button><button class="filter" data-profile-filter="User">Аккаунты</button><button class="filter" data-profile-filter="Bot">Боты</button></div><input class="input search-input" id="profile-search" aria-label="Найти профиль" placeholder="Найти профиль…"></div>`+
      `<section class="panel table-wrap"><table><thead><tr><th>ПРОФИЛЬ / BACKEND</th><th>СОСТОЯНИЕ</th><th>READ POLICY</th><th>ПРОКСИ</th><th><span class="sr-only">Действия</span></th></tr></thead><tbody id="profile-rows">${profiles.map(p=>`<tr data-profile="${p[0]} ${p[1]}"><td>${person(p[0],p[1],p[2])}</td><td>${badge(p[3],p[4])}</td><td><strong>${p[6]}</strong><div class="muted">Selected · без расширения доступа</div></td><td><span class="mono">${p[5]}</span></td><td>${button('Диагностика','diagnostics',false,`data-profile-name="${p[0]}"`)}</td></tr>`).join('')}</tbody></table></section>`+
      `<div class="grid even" style="margin-top:24px">${panel('Что доступно аккаунту',`<div class="panel-body"><p class="muted">История выбранных чатов, папки, поиск и подтверждённые операции. Каждый профиль использует собственную сессию.</p><div class="design-examples" style="margin-top:20px">${badge('MTProto')}${badge('Папки','neutral')}${badge('История','neutral')}</div></div>`)}${panel('Что доступно боту',`<div class="panel-body"><p class="muted">Доступные updates и разрешённые действия Bot API. Наблюдённые сообщения сохраняются локально.</p><div class="design-examples" style="margin-top:20px">${badge('Bot API')}${badge('Updates','neutral')}${badge('История ограничена','warn')}</div></div>`)}</div>`;
    }
    function jobPage(){

    }
    function design(){
      const colors=[['Graphite','#090e0b'],['Surface','#101713'],['Raised','#171f1a'],['Lime','#d1f760'],['Chrome','#cdd6d0'],['Text','#eef3ef'],['Muted','#a8b4ab'],['Line','#2b372e']];
      return heading('Стиль интерфейса','Хром и лайм из teleloom.png, адаптированные к ежедневной работе.')+
        `<img class="brand-reference" src="../assets/teleloom.png" width="2048" height="684" alt="Исходный арт Teleloom: хромированный самолёт на графитовом фоне с лаймовыми линиями"><section class="design-section"><h2>Палитра</h2><div class="token-grid">${colors.map(c=>`<div><div class="swatch" style="background:${c[1]}"></div><div class="swatch-name">${c[0]}</div><div class="swatch-code">${c[1]}</div></div>`).join('')}</div></section><div class="grid even">${panel('Типографика',`<div class="panel-body"><div class="type-sample"><div class="type-headline">Workspace под контролем</div><div class="row-note">Заголовок · 32 / 38 · Segoe UI</div></div><div class="type-sample"><h2>Профили и разрешения</h2><div class="row-note">Раздел · 18 / 25 · Semibold</div></div><div class="type-sample">Источники, процессы и точные действия.<div class="row-note">Текст · 14 / 22 · Regular</div></div><div class="type-sample mono">WORK-USER / EVIDENCE-DEMO-014<div class="row-note">Метаданные · 12 · Cascadia Code</div></div></div>`)}${panel('Компоненты',`<div class="panel-body"><div class="design-examples">${button('Основное действие','design-feedback',true)}${button('Второе действие','design-feedback')}${button('Недоступно','design-feedback',false,'disabled')}</div><div class="design-examples" style="margin:25px 0">${badge('Готов')}${badge('Ожидание','neutral')}${badge('Нужна сверка','warn')}${badge('Ошибка','error')}</div>${field('Поле с подписью','design-input','work-user')}${setting('Отдельное разрешение','Состояние показывается текстом и контролом.',toggle('Демо разрешение',true))}<div class="notice neutral" style="margin-bottom:0">Хром используется в бренде. Рабочие поверхности матовые, чтобы не мешать чтению.</div></div>`)}</div><div class="viewport-note">Прямые углы · шаги сетки 4, 8, 12, 16, 24, 32 px</div>`;
    }
    const renders={overview,profiles:profilePage,jobs:jobPage,tools:toolsPage,'user-login':userLogin,'bot-login':botLogin,permissions,integrations,proxies,engines,reading,compose,remote,design};
    function render(focus=false){
      current=location.hash.slice(1) in renders?location.hash.slice(1):'overview';
      navigation();document.title=`Teleloom · ${pages.find(p=>p[0]===current)[1]} · макет`;
      document.body.classList.remove('menu-open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');
      let html=renders[current]();
      if(pageState!=='normal'){
        const labels={loading:['Загружаем workspace','Собираем локальный снимок состояния.'],empty:['Здесь пока пусто','Подключите профиль, чтобы настроить свой workspace.'],error:['Снимок недоступен','Демонстрационная ошибка связи с owner. Сохранённое состояние не удалено.']};
        const [title,sub]=labels[pageState];
        html=heading(pages.find(p=>p[0]===current)[1],'Демонстрационное состояние интерфейса.')+`<section class="empty-state">${pageState==='loading'?'<div class="spinner" aria-hidden="true"></div>':`<div class="empty-icon">${icon(pageState==='empty'?'plus':'activity')}</div>`}<h2>${title}</h2><p>${sub}</p>${pageState==='empty'?go('Подключить профиль','user-login',true):''}${button(pageState==='error'?'Повторить (демо)':'Показать данные','state-reset',true)}</section>`;
      }
      $('main').innerHTML=html;
      if(current==='tools' && pageState==='normal') document.querySelectorAll('[data-tool-key]').forEach(input=>{if(toolChanges.has(input.dataset.toolKey))input.checked=toolChanges.get(input.dataset.toolKey);});
      if(focus){$('main').focus();window.scrollTo(0,0);}
    }
    function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',4500);}
    function openDialog(title,body,actions=''){
      modalReturn=document.activeElement;
      $('dialog').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-btn" aria-label="Закрыть диалог" data-action="close">${icon('close')}</button></div><div class="dialog-body">${body}</div>${actions?`<div class="dialog-actions">${actions}</div>`:''}`;
      $('dialog').showModal();
    }
    function closeDialog(){if($('dialog').open)$('dialog').close();}
    $('dialog').addEventListener('close',()=>{preview=null;if(modalReturn?.isConnected)modalReturn.focus();});
    function review(title,body,action='demo-apply') {openDialog(title,`<p class="dialog-sub">Изменения применятся только к демонстрационному состоянию.</p>${body}`,button('Отмена','close')+button('Применить (демо)',action,true));}
    function updateMessage(){if(!$('send-text'))return;$('live-message').textContent=$('send-text').value;$('char-count').textContent=$('send-text').value.length;$('preview-profile').textContent=$('send-profile').value;$('preview-target').textContent=$('send-target').selectedOptions[0].textContent;}
    function filterMessages(chat='all'){
      const active=document.querySelector('[data-chat].active')?.dataset.chat || chat;
      const query=$('message-search').value.toLocaleLowerCase('ru');
      const results=messages.filter(m=>(active==='all'||m[1]===active)&&m.join(' ').toLocaleLowerCase('ru').includes(query));
      $('reading-results').innerHTML=results.length?messageCards(results):'<div class="empty-state" style="border:0"><h2>Совпадений нет</h2><p>Попробуйте другой запрос в этом снимке.</p></div>';
    }
    document.addEventListener('input',event=>{
      if(['send-text','send-profile','send-target'].includes(event.target.id))updateMessage();
      if(event.target.id==='message-search')filterMessages();
      if(event.target.id==='profile-search')document.querySelectorAll('[data-profile]').forEach(row=>row.hidden=!row.dataset.profile.toLowerCase().includes(event.target.value.toLowerCase()));
      if(event.target.id==='command-search')document.querySelectorAll('[data-command]').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(event.target.value.toLowerCase()));
    });
    document.addEventListener('change',event=>{
      if(event.target.id==='state-picker'){pageState=event.target.value;render();}
      if(event.target.id==='read-policy')$('selected-chats').hidden=event.target.value==='all';
      if(event.target.matches('[data-tool-key]')){if(String(event.target.checked)===event.target.dataset.original)toolChanges.delete(event.target.dataset.toolKey);else toolChanges.set(event.target.dataset.toolKey,event.target.checked);$('tool-count').textContent=`${toolChanges.size} наборов`;}
      if(['send-profile','send-target'].includes(event.target.id))updateMessage();
    });
    document.addEventListener('click',event=>{
      const target=event.target.closest('button,[data-action]');if(!target)return;
      if(target.dataset.command){closeDialog();pageState='normal';$('state-picker').value='normal';location.hash=target.dataset.command;render(true);return;}
      if(target.dataset.profileFilter){document.querySelectorAll('[data-profile-filter]').forEach(b=>b.classList.toggle('active',b===target));document.querySelectorAll('[data-profile]').forEach(row=>row.hidden=target.dataset.profileFilter!=='all'&&!row.dataset.profile.includes(target.dataset.profileFilter));return;}
      if(target.dataset.jobFilter){document.querySelectorAll('[data-job-filter]').forEach(b=>b.classList.toggle('active',b===target));document.querySelectorAll('[data-job]').forEach(row=>row.hidden=target.dataset.jobFilter!=='all'&&!row.dataset.job.includes(target.dataset.jobFilter));return;}
      if(target.dataset.chat){document.querySelectorAll('[data-chat]').forEach(b=>b.classList.toggle('active',b===target));document.querySelectorAll('[data-reading-tab]').forEach(b=>b.classList.toggle('active',b.dataset.readingTab==='messages'));filterMessages(target.dataset.chat);return;}
      if(target.dataset.readingTab){document.querySelectorAll('[data-reading-tab]').forEach(b=>b.classList.toggle('active',b===target));if(target.dataset.readingTab==='messages')filterMessages();else $('reading-results').innerHTML=target.dataset.readingTab==='sources'?`<div class="panel-body"><h3>Источники frozen evidence</h3><p class="muted small" style="margin-top:12px">Оригиналы связаны с профилем, чатом и сообщением.</p>${messages.map(m=>`<div class="row" style="padding:14px 0"><span>${m[1]}</span><span class="mono muted">${m[4]}</span></div>`).join('')}</div>`:`<div class="panel-body"><h3>Что покрывает снимок</h3><div class="notice warn" style="margin-top:20px">Релизы: partial. Достигнут лимит коллекции; продолжение требует нового явного действия.</div><p class="muted">6 оригинальных сообщений из 3 выбранных источников. Это не полная история Telegram.</p></div>`;return;}
      const action=target.dataset.action;
      if(action==='close'){closeDialog();return;}
      if(action==='menu'||action==='menu-close'){const show=action==='menu'&&!document.body.classList.contains('menu-open');document.body.classList.toggle('menu-open',show);document.querySelector('.menu-toggle').setAttribute('aria-expanded',String(show));if(show)document.querySelector('.nav-item').focus();return;}
      if(action==='state-reset'){pageState='normal';$('state-picker').value='normal';render(true);return;}
      if(action==='refresh'){toast('Демонстрационный снимок обновлён.');return;}
      if(action==='workspace'){openDialog('Выбрать workspace',`<div class="command-list"><button data-command="overview">Этот компьютер <small>Локальный · демо</small></button><button data-command="remote">teleloom-vps <small>SSH · настройка</small></button></div>`);return;}
      if(action==='search'){openDialog('Найти раздел',`<input class="input" id="command-search" aria-label="Поиск раздела" placeholder="Профили, прокси, сообщения…"><div class="command-list">${pages.map(p=>`<button data-command="${p[0]}">${p[1]}<small>${p[4]}</small></button>`).join('')}</div>`);$('command-search').focus();return;}
      if(action==='diagnostics'){openDialog('Диагностика профиля',`<div class="notice neutral">Пассивный снимок · ${escapeHTML(target.dataset.profileName)}</div><dl class="facts"><dt>Backend</dt><dd>${target.dataset.profileName==='release-bot'?'Bot API':'User MTProto'}</dd><dt>Сессия</dt><dd>Настроена · демонстрационные данные</dd><dt>Read policy</dt><dd>Selected · выбранные чаты</dd><dt>Подключение</dt><dd>Для проверки выберите один разрешённый источник.</dd></dl><label class="field"><span>Источник для ограниченной проверки</span><select><option>Команда Teleloom · demo-001</option></select></label>`,button('Закрыть','close')+button('Проверить (демо)','diagnostics-test',true));return;}
      if(action==='diagnostics-test'){closeDialog();toast('Демо проверка: профиль доступен. Содержимое сообщений не запрашивалось.');return;}
      if(action==='job-detail'){const j=jobs[Number(target.dataset.jobIndex)];openDialog(j[1],`<dl class="facts"><dt>Job</dt><dd class="mono">${j[0]}</dd><dt>Профиль</dt><dd>${j[2]}</dd><dt>Результат</dt><dd>${badge(j[3],j[4])}</dd></dl>${j[4]==='warn'?'<div class="notice warn">Отправка могла завершиться. Receipt сохраняет неопределённость; безопасный следующий шаг: сверка без повторной отправки.</div>':`<div class="notice neutral">${j[5]}</div>`}`,button('Закрыть','close')+(j[4]==='warn'?button('Отложить сверку','receipt-later'):go('Открыть evidence','reading')));return;}
      if(action==='receipt-later'){closeDialog();toast('Демо receipt остаётся неизвестным. Повторная отправка не запущена.');return;}
      if(action==='tool-review'){if(!toolChanges.size){toast('Изменений нет. Выберите другой набор инструментов.');return;}review('Изменение tool exposure',`<table><thead><tr><th>НАБОР</th><th>БУДЕТ</th></tr></thead><tbody>${Array.from(toolChanges,([key,val])=>`<tr><td>${key}</td><td>${val?'Включён':'Выключен'}</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:20px;margin-bottom:0">Owner будет безопасно перезапущен после завершения активного чтения.</div>`,'tool-apply');return;}
      if(action==='tool-apply'){for(const [key,value] of toolChanges)toolState.set(key,value);toolChanges.clear();closeDialog();render();toast('Демо изменения применены. Показан сценарий безопасного restart.');return;}
      if(action==='user-next'){userName=$('user-name').value.trim();if(!userName||profiles.some(p=>p[0]===userName)){$('user-name').setAttribute('aria-invalid','true');toast(userName?'Имя профиля уже занято.':'Укажите имя профиля.');$('user-name').focus();return;}loginStep=2;render(true);return;}
      if(action==='qr-refresh'){toast('Демонстрационный QR обновлён.');return;}
      if(action==='user-2fa'){loginStep=3;render(true);return;}
      if(action==='user-back'){loginStep=2;render(true);return;}
      if(action==='user-finish'){if(!$('user-password').value){toast('Введите демонстрационный пароль.');$('user-password').focus();return;}profiles.push([escapeHTML(userName),'User · MTProto','NU','Готов в демо','','Не назначен','0 выбранных чатов']);loginStep=4;render(true);return;}
      if(action==='bot-connect'){if(!$('bot-name').value.trim()||!$('bot-token').value){toast('Укажите имя и демонстрационный token.');return;}botConnected=true;render(true);return;}
      if(action==='permissions-review'){const selected=Array.from(document.querySelectorAll('#selected-chats input:checked'),i=>i.value);review('Изменение доступа',`<dl class="facts"><dt>Профиль</dt><dd>${escapeHTML($('permission-profile').value)}</dd><dt>Read policy</dt><dd>${$('read-policy').value==='all'?'All · все доступные чаты':`Selected · ${selected.length} чата`}</dd><dt>Действия</dt><dd>${Array.from(document.querySelectorAll('[data-grant]:checked'),i=>i.dataset.grant).join(', ')||'Не разрешены'}</dd></dl><div class="notice warn" style="margin-bottom:0">Постоянные разрешения меняет только владелец workspace.</div>`);return;}
      if(action==='client-install'){review(`Регистрация ${target.dataset.client}`,`<dl class="facts"><dt>MCP server</dt><dd>teleloom</dd><dt>Запуск</dt><dd class="mono">PYTHON -m teleloom mcp</dd><dt>Существующие записи</dt><dd>Сохранить; конфликт не заменять</dd></dl>`);return;}
      if(action==='client-test'){openDialog(`Проверка ${target.dataset.client}`,`<div class="notice">Демонстрационный результат</div><dl class="facts"><dt>Конфигурация</dt><dd>teleloom зарегистрирован</dd><dt>Discovery</dt><dd>67 tools доступны</dd><dt>Skills</dt><dd>6 файлов установлены · workflow модели ещё не проверен</dd></dl>`,button('Закрыть','close'));return;}
      if(action==='skill-review'){review('Обновление skills','<div class="notice warn">Будут заменены 6 поставляемых teleloom skills. Другие skills сохраняются.</div>');return;}
      if(action==='config-export'){openDialog('Экспорт конфигурации','<p class="dialog-sub">Демонстрационный фрагмент; пути выбираются для вашей установки.</p><pre class="code">{"mcpServers":{"teleloom":{"command":"PYTHON","args":["-m","teleloom","mcp"],"env":{"TELELOOM_DATA_DIR":"DATA_DIR"}}}}</pre>',button('Закрыть','close'));return;}
      if(action==='proxy-add'){openDialog('Добавить именованный прокси',field('Имя','new-proxy-name','eu-next')+`<label class="field"><span>Протокол</span><select><option>SOCKS5</option><option>SOCKS4</option><option>HTTP</option></select></label>`+field('Host','new-proxy-host','proxy.example')+field('Port','new-proxy-port','1080','','number'),button('Отмена','close')+button('Сохранить (демо)','demo-apply',true));return;}
      if(action==='proxy-check'){openDialog('Проверка маршрута',`<p class="dialog-sub">Только демонстрация результата, без сетевого подключения.</p><dl class="facts"><dt>Прокси</dt><dd>${target.dataset.proxy}</dd><dt>Результат</dt><dd>${badge(target.dataset.proxy==='bot-route'?'Соединение недоступно':'Маршрут доступен',target.dataset.proxy==='bot-route'?'warn':'')}</dd><dt>Direct fallback</dt><dd>Отключён</dd></dl>`,button('Закрыть','close'));return;}
      if(action==='proxy-assign'){review('Назначение прокси',`<dl class="facts"><dt>Профиль</dt><dd>${escapeHTML($('proxy-profile').value)}</dd><dt>Новый маршрут</dt><dd>${escapeHTML($('proxy-choice').value)}</dd></dl>`);return;}
      if(action==='engine-review'){review('Настройка engines',`<dl class="facts"><dt>Транскрипция</dt><dd>${escapeHTML($('transcription-engine').value)}</dd><dt>Доступ в AI</dt><dd>Постоянные grants профилей сохраняются</dd><dt>Сеть и установка</dt><dd>Запросы и скачивание не запускаются</dd></dl>`);return;}
      if(action==='engine-check'){toast('Демо диагностика: extra и локальная модель доступны. AI-запрос не запускался.');return;}
      if(action==='collect'){openDialog('Собрать новый снимок',`<dl class="facts"><dt>Профиль</dt><dd>${escapeHTML($('reading-profile').value)}</dd><dt>Источники</dt><dd>3 выбранных чата</dd><dt>Период</dt><dd>07.10.2026 · 00:00–14:26</dd><dt>Бюджет</dt><dd>6 сообщений · демонстрация partial coverage</dd></dl><div class="notice neutral" style="margin-bottom:0">Новый сбор начинается отдельным действием. Просмотр текущего снимка ничего не перечитывает.</div>`,button('Отмена','close')+button('Начать сбор (демо)','demo-apply',true));return;}
      if(action==='period'){openDialog('Период снимка','<div class="command-list"><button data-action="period-pick">Сегодня · 07 октября</button><button data-action="period-pick">Последние 7 дней</button><button data-action="period-pick">Выбранный диапазон</button></div>');return;}
      if(action==='period-pick'){closeDialog();toast('Период выбран в демо. Текущий frozen snapshot не изменён.');return;}
      if(action==='source'){const m=messages.find(m=>m[4]===target.dataset.source);openDialog('Оригинал и источник',`<dl class="facts"><dt>Профиль / чат / сообщение</dt><dd class="mono">work-user / ${m[1]} / ${m[4]}</dd><dt>Снимок</dt><dd class="mono">evidence-demo-014 · оригинал</dd></dl><div class="preview-text">${m[3]}</div>`,button('Закрыть','close'));return;}
      if(action==='compose-clear'){$('send-text').value='';updateMessage();return;}
      if(action==='send-preview'){
        const text=$('send-text').value;if(!text.trim()){toast('Добавьте текст сообщения.');$('send-text').focus();return;}
        const frozen={profile:$('send-profile').value,target:$('send-target').selectedOptions[0].textContent,text};
        openDialog('Подтвердить точное сообщение',`<p class="dialog-sub">Демонстрационный план · один получатель · действует 5 минут</p><dl class="facts"><dt>Отправитель</dt><dd>${escapeHTML(frozen.profile)}</dd><dt>Получатель</dt><dd>${escapeHTML(frozen.target)}</dd></dl><div class="preview-text">${escapeHTML(text)}</div><div class="notice neutral" style="margin-top:18px;margin-bottom:0">Вы подтверждаете только показанный текст. Изменение сообщения потребует нового предпросмотра.</div>`,button('Вернуться','close')+button('Отправить (демо)','send-confirm',true));
        preview=Object.freeze(frozen);return;
      }
      if(action==='send-confirm'){
        if(!preview||target.disabled)return;target.disabled=true;const sent=preview;
        closeDialog();receiptState='delivered';render();
        openDialog('Результат демонстрации',`<div class="notice">Реальное сообщение не отправлялось.</div><dl class="facts"><dt>Получатель</dt><dd>${escapeHTML(sent.target)}</dd><dt>Receipt</dt><dd class="mono">receipt-demo-019</dd><dt>Статус</dt><dd>${badge('Завершён в демо')}</dd></dl>`,button('Показать неизвестный результат','send-unknown')+button('Готово','close',true));return;
      }
      if(action==='send-unknown'){closeDialog();receiptState='unknown';render();toast('Неизвестный результат сохранён в демо. Автоматический повтор отключён.');return;}
      if(action==='ssh-open'){const host=$('ssh-host').value.trim(),port=Number($('ssh-port').value);if(!host||!Number.isInteger(port)||port<1||port>65535){toast('Укажите SSH host и порт от 1 до 65535.');return;}openDialog('Приватное подключение',`<p class="dialog-sub">Макет результата; OpenSSH не запускается.</p><dl class="facts"><dt>SSH host</dt><dd>${escapeHTML(host)}</dd><dt>Локальная панель</dt><dd class="mono">127.0.0.1:${port}</dd><dt>Туннель</dt><dd>${badge('Доступен в демо')}</dd><dt>Браузерная сессия</dt><dd>Отдельная, краткоживущая</dd></dl>`,button('Закрыть','close')+button('Открыть workspace (демо)','ssh-workspace',true));return;}
      if(action==='ssh-workspace'){closeDialog();location.hash='overview';toast('Показан локальный демо workspace. Реальный VPS не подключался.');return;}
      if(action==='demo-apply'){closeDialog();toast('Демонстрационные изменения применены.');return;}
      if(action==='design-feedback')toast('Пример состояния кнопки.');
    });
    document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('dialog').open)document.querySelector('[data-action="search"]').click();}if(event.key==='Escape'){document.body.classList.remove('menu-open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');}});
    window.addEventListener('hashchange',()=>{closeDialog();pageState='normal';$('state-picker').value='normal';render(true);});
    render();
  </script>
</body>
</html>
